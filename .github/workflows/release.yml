name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm make

      - name: Find EXE
        id: artifact
        run: |
          $exe = Get-ChildItem -Path out\make\squirrel.windows -Recurse -Filter *.exe | Select-Object -First 1 -ExpandProperty FullName
          "path=$exe" >> $env:GITHUB_OUTPUT
          "name=$(Split-Path $exe -Leaf)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: polargroup-totem-setup
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 30

  build-docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export image digest
        id: digest
        run: |
          echo "digest=${{ steps.meta.outputs.version }}" >> $GITHUB_OUTPUT

    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-exe, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polargroup-totem-setup

      - name: Generate release notes
        id: notes
        run: |
          cat << 'EOF' > release-notes.md
          ## ${{ github.ref_name }}

          ### Downloads

          | Platform | Link |
          |---|---|
          | Windows (EXE) | See attached setup below |
          | Docker | `docker pull ghcr.io/revirtua-vr/polargroup-totem:${{ github.ref_name }}` |
          | Docker (latest) | `docker pull ghcr.io/revirtua-vr/polargroup-totem:latest` |

          ### Docker

          ```bash
          docker pull ghcr.io/revirtua-vr/polargroup-totem:${{ github.ref_name }}
          docker run -p 80:80 ghcr.io/revirtua-vr/polargroup-totem:${{ github.ref_name }}
          ```

          ### Windows Kiosk

          Download the setup EXE below. Install and it will launch in fullscreen kiosk mode automatically.
          EOF
          echo "path=release-notes.md" >> $GITHUB_OUTPUT

      - name: Find setup file
        id: exe
        run: |
          exe=$(ls *.exe | head -1)
          echo "path=$exe" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ steps.exe.outputs.path }}

  release-latest:
    name: Update Latest Rolling Release
    runs-on: ubuntu-latest
    needs: [build-exe, build-docker]
    if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
    concurrency:
      group: rolling-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: polargroup-totem-setup

      - name: Delete previous rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Move latest tag
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Generate release notes
        id: notes
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cat << EOF > release-notes.md
          ## Latest build

          Commit: \`${{ github.sha }}\`

          ### Downloads

          | Platform | Link |
          |---|---|
          | Windows (EXE) | See attached setup below |
          | Docker | \`docker pull ghcr.io/revirtua-vr/polargroup-totem:latest\` |
          | Docker (commit) | \`docker pull ghcr.io/revirtua-vr/polargroup-totem:sha-${SHORT_SHA}\` |

          ### Docker

          ```bash
          docker pull ghcr.io/revirtua-vr/polargroup-totem:latest
          docker run -p 80:80 ghcr.io/revirtua-vr/polargroup-totem:latest
          ```
          EOF
          echo "path=release-notes.md" >> $GITHUB_OUTPUT

      - name: Find setup file
        id: exe
        run: |
          exe=$(ls *.exe | head -1)
          echo "path=$exe" >> $GITHUB_OUTPUT

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest \
            --title "Latest build" \
            --latest \
            --notes-file release-notes.md \
            ${{ steps.exe.outputs.path }}
