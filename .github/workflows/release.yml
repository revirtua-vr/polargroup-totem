name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  next-version:
    name: Compute next version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    outputs:
      version: ${{ steps.compute.outputs.version }}
      major_minor: ${{ steps.compute.outputs.major_minor }}
      base: ${{ steps.compute.outputs.base }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver
        id: compute
        run: |
          set -euo pipefail

          git fetch origin --tags --force

          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then
            MAJOR=0; MINOR=0; PATCH=0
            LOG="$(git log --format='%s%n%b')"
          else
            V="${BASE#v}"
            MAJOR=$(echo "$V" | cut -d. -f1)
            MINOR=$(echo "$V" | cut -d. -f2)
            PATCH=$(echo "$V" | cut -d. -f3)
            LOG="$(git log "$BASE"..HEAD --format='%s%n%b')"
          fi

          if echo "$LOG" | grep -qE 'BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!:'; then
            MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
            MINOR=$((MINOR+1)); PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEW="v$MAJOR.$MINOR.$PATCH"
          while git ls-remote --exit-code --tags origin "refs/tags/$NEW" >/dev/null 2>&1; do
            PATCH=$((PATCH+1))
            NEW="v$MAJOR.$MINOR.$PATCH"
          done

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW (base: ${BASE:-none})"

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm make

      - name: Find EXE
        id: artifact
        run: |
          $exe = Get-ChildItem -Path out\make\squirrel.windows -Recurse -Filter *.exe | Select-Object -First 1 -ExpandProperty FullName
          "path=$exe" >> $env:GITHUB_OUTPUT
          "name=$(Split-Path $exe -Leaf)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: polargroup-totem-setup
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 30

  build-docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: next-version
    if: ${{ always() && needs.next-version.result != 'failure' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Append auto-version tags
        id: tags
        env:
          NEW_VERSION: ${{ needs.next-version.outputs.version }}
          MAJOR_MINOR: ${{ needs.next-version.outputs.major_minor }}
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          if [ -n "$NEW_VERSION" ]; then
            TAGS="${TAGS}"$'\n'"${REGISTRY}/${IMAGE_NAME}:${NEW_VERSION}"
            TAGS="${TAGS}"$'\n'"${REGISTRY}/${IMAGE_NAME}:${MAJOR_MINOR}"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release (manual tag)
    runs-on: ubuntu-latest
    needs: [build-exe, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polargroup-totem-setup

      - name: Generate release notes
        id: notes
        run: |
          cat << 'EOF' > release-notes.md
          ## ${{ github.ref_name }}

          ### Downloads

          | Platform | Link |
          |---|---|
          | Windows (EXE) | See attached setup below |
          | Docker | `docker pull ghcr.io/revirtua-vr/polargroup-totem:${{ github.ref_name }}` |
          | Docker (latest) | `docker pull ghcr.io/revirtua-vr/polargroup-totem:latest` |

          ### Docker

          ```bash
          docker pull ghcr.io/revirtua-vr/polargroup-totem:${{ github.ref_name }}
          docker run -p 80:80 ghcr.io/revirtua-vr/polargroup-totem:${{ github.ref_name }}
          ```

          ### Windows Kiosk

          Download the setup EXE below. Install and it will launch in fullscreen kiosk mode automatically.
          EOF
          echo "path=release-notes.md" >> $GITHUB_OUTPUT

      - name: Find setup file
        id: exe
        run: |
          exe=$(ls *.exe | head -1)
          echo "path=$exe" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ steps.exe.outputs.path }}

  create-release:
    name: Create versioned release (main)
    runs-on: ubuntu-latest
    needs: [next-version, build-exe, build-docker]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: polargroup-totem-setup

      - name: Create and push version tag
        env:
          VERSION: ${{ needs.next-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ needs.next-version.outputs.version }}
          BASE: ${{ needs.next-version.outputs.base }}
        run: |
          {
            echo "## $VERSION"
            echo ""
            echo "### Changelog"
            echo ""
            if [ -n "$BASE" ]; then
              git log "$BASE"..HEAD --format='- %s (%h)'
            else
              git log --format='- %s (%h)'
            fi
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | Link |"
            echo "|---|---|"
            echo "| Windows (EXE) | See attached setup below |"
            echo "| Docker | \`docker pull ghcr.io/revirtua-vr/polargroup-totem:$VERSION\` |"
            echo "| Docker (latest) | \`docker pull ghcr.io/revirtua-vr/polargroup-totem:latest\` |"
            echo ""
            echo "### Docker"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/revirtua-vr/polargroup-totem:$VERSION"
            echo "docker run -p 80:80 ghcr.io/revirtua-vr/polargroup-totem:$VERSION"
            echo '```'
            echo ""
            echo "### Windows Kiosk"
            echo ""
            echo "Download the setup EXE below. Install and it will launch in fullscreen kiosk mode automatically."
          } > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Find setup file
        id: exe
        run: |
          exe=$(ls *.exe | head -1)
          echo "path=$exe" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.next-version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --latest \
            --notes-file release-notes.md \
            "${{ steps.exe.outputs.path }}"
